[build]
  # Generate Prisma client before building
  command = "npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  # Node.js version
  NODE_VERSION = "18"
  # Ensure production environment
  NODE_ENV = "production"
  # Skip Husky installation in CI
  HUSKY_SKIP_INSTALL = "1"

# Netlify Functions configuration (if using API routes)
[functions]
  node_bundler = "esbuild"

# Next.js specific plugin
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables that should be available during build
[context.production.environment]
  NODE_ENV = "production"

[context.deploy-preview.environment]
  NODE_ENV = "production"

[context.branch-deploy.environment]
  NODE_ENV = "production"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects for SPA routing (if needed)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Handle client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}

# Edge functions (if using any)
[edge_functions]
  # Add any edge function configurations here if needed

# Build optimization
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true